<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纳斯达克指标仪表板</title>
    <!-- 引入 Chart.js 库和注解插件 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.3/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.2.1/dist/chartjs-plugin-annotation.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
            color: #333;
        }
        h1 {
            text-align: center;
            padding: 20px;
        }
        .summary {
            background-color: #fff;
            padding: 20px;
            margin: 20px auto;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-width: 1000px;
        }
        .summary-item {
            display: inline-block;
            width: 24%;
            text-align: center;
            margin-bottom: 10px;
        }
        .charts {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }
        .chart-container {
            width: 48%;
            background-color: #fff;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        canvas {
            width: 100% !important;
            height: 350px !important;
        }
    </style>
</head>
<body>
    <h1>纳斯达克指标仪表板</h1>
    <div class="summary" id="summary"></div>
    <div class="charts">
        <div class="chart-container">
            <h3>MACD 指标</h3>
            <canvas id="macdChart"></canvas>
        </div>
        <div class="chart-container">
            <h3>收盘价与200日均线</h3>
            <canvas id="maChart"></canvas>
        </div>
        <div class="chart-container">
            <h3>RSI 指标</h3>
            <canvas id="rsiChart"></canvas>
        </div>
        <div class="chart-container">
            <h3>VIX 指数</h3>
            <canvas id="vixChart"></canvas>
        </div>
    </div>

    <script>
    /**
     * 加载数据后初始化仪表板。
     * 页面加载完成后，使用 fetch 从同目录的 nasdaq_vix_data.json 文件获取数据，
     * 然后绘制图表和更新概要。
     */
    function initializeDashboard(data) {
        const nasdaqDates = data.nasdaq.dates.map(d => new Date(d));
        const vixDates = data.vix.dates.map(d => new Date(d));

        function updateSummary() {
            const latestIndex = nasdaqDates.length - 1;
            const summaryEl = document.getElementById('summary');
            const rows = [];
            rows.push(`<div class="summary-item"><strong>数据日期：</strong><br>${data.nasdaq.dates[latestIndex]}</div>`);
            rows.push(`<div class="summary-item"><strong>收盘价：</strong><br>${data.nasdaq.close[latestIndex].toFixed(2)}</div>`);
            rows.push(`<div class="summary-item"><strong>MACD：</strong><br>${data.nasdaq.macd[latestIndex].toFixed(2)} / 信号线 ${data.nasdaq.macd_signal[latestIndex].toFixed(2)}</div>`);
            rows.push(`<div class="summary-item"><strong>200日均线：</strong><br>${data.nasdaq.ma200[latestIndex].toFixed(2)}</div>`);
            rows.push(`<div class="summary-item"><strong>RSI：</strong><br>${data.nasdaq.rsi[latestIndex].toFixed(2)}</div>`);
            rows.push(`<div class="summary-item"><strong>VIX：</strong><br>${data.vix.close[data.vix.close.length - 1].toFixed(2)}</div>`);
            summaryEl.innerHTML = rows.join('');
        }

        updateSummary();

        // MACD chart (line and histogram)
        const macdCtx = document.getElementById('macdChart').getContext('2d');
        const macdHistogram = data.nasdaq.macd.map((val, idx) => val - data.nasdaq.macd_signal[idx]);
        new Chart(macdCtx, {
            type: 'bar',
            data: {
                labels: nasdaqDates,
                datasets: [
                    {
                        type: 'bar',
                        label: 'MACD 柱状图',
                        data: macdHistogram,
                        backgroundColor: macdHistogram.map(val => val >= 0 ? 'rgba(0, 200, 83, 0.5)' : 'rgba(229, 57, 53, 0.5)'),
                        borderWidth: 0
                    },
                    {
                        type: 'line',
                        label: 'MACD',
                        data: data.nasdaq.macd,
                        borderColor: '#00C853',
                        borderWidth: 1.5,
                        fill: false,
                        yAxisID: 'y1'
                    },
                    {
                        type: 'line',
                        label: '信号线',
                        data: data.nasdaq.macd_signal,
                        borderColor: '#ffab00',
                        borderWidth: 1.5,
                        fill: false,
                        yAxisID: 'y1'
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    x: {
                        type: 'time',
                        time: {
                            unit: 'month',
                            displayFormats: { month: 'yyyy-MM' }
                        },
                        ticks: { maxTicksLimit: 10 }
                    },
                    y: {
                        position: 'left',
                        beginAtZero: true,
                        title: { display: true, text: 'MACD 柱状图' }
                    },
                    y1: {
                        position: 'right',
                        grid: { drawOnChartArea: false },
                        title: { display: true, text: 'MACD 与信号线' }
                    }
                },
                plugins: {
                    legend: { position: 'top' },
                    tooltip: { mode: 'index', intersect: false }
                },
                interaction: { mode: 'nearest', intersect: false }
            }
        });

        // Moving average and close price chart
        const maCtx = document.getElementById('maChart').getContext('2d');
        new Chart(maCtx, {
            type: 'line',
            data: {
                labels: nasdaqDates,
                datasets: [
                    {
                        label: '收盘价',
                        data: data.nasdaq.close,
                        borderColor: '#2962FF',
                        borderWidth: 1.5,
                        fill: false
                    },
                    {
                        label: '200日均线',
                        data: data.nasdaq.ma200,
                        borderColor: '#D500F9',
                        borderWidth: 1.5,
                        fill: false
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    x: {
                        type: 'time',
                        time: { unit: 'month', displayFormats: { month: 'yyyy-MM' } },
                        ticks: { maxTicksLimit: 10 }
                    },
                    y: { title: { display: true, text: '指数值' } }
                },
                plugins: {
                    legend: { position: 'top' },
                    tooltip: { mode: 'index', intersect: false }
                },
                interaction: { mode: 'nearest', intersect: false }
            }
        });

        // RSI chart
        const rsiCtx = document.getElementById('rsiChart').getContext('2d');
        new Chart(rsiCtx, {
            type: 'line',
            data: {
                labels: nasdaqDates,
                datasets: [
                    {
                        label: 'RSI',
                        data: data.nasdaq.rsi,
                        borderColor: '#00bfa5',
                        borderWidth: 1.5,
                        fill: false
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    x: {
                        type: 'time',
                        time: { unit: 'month', displayFormats: { month: 'yyyy-MM' } },
                        ticks: { maxTicksLimit: 10 }
                    },
                    y: { min: 0, max: 100, title: { display: true, text: 'RSI' } }
                },
                plugins: {
                    legend: { position: 'top' },
                    tooltip: { mode: 'index', intersect: false },
                    annotation: {
                        annotations: {
                            overbought: {
                                type: 'line',
                                yMin: 70,
                                yMax: 70,
                                borderColor: 'red',
                                borderWidth: 1,
                                label: { content: '70 - 超买', enabled: true, position: 'end' }
                            },
                            oversold: {
                                type: 'line',
                                yMin: 30,
                                yMax: 30,
                                borderColor: 'green',
                                borderWidth: 1,
                                label: { content: '30 - 超卖', enabled: true, position: 'end' }
                            }
                        }
                    }
                },
                interaction: { mode: 'nearest', intersect: false }
            }
        });

        // VIX chart
        const vixCtx = document.getElementById('vixChart').getContext('2d');
        new Chart(vixCtx, {
            type: 'line',
            data: {
                labels: vixDates,
                datasets: [
                    {
                        label: 'VIX 收盘价',
                        data: data.vix.close,
                        borderColor: '#FF5722',
                        borderWidth: 1.5,
                        fill: false
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    x: {
                        type: 'time',
                        time: { unit: 'month', displayFormats: { month: 'yyyy-MM' } },
                        ticks: { maxTicksLimit: 10 }
                    },
                    y: { title: { display: true, text: 'VIX' } }
                },
                plugins: {
                    legend: { position: 'top' },
                    tooltip: { mode: 'index', intersect: false }
                },
                interaction: { mode: 'nearest', intersect: false }
            }
        });
    }

    // 页面加载完成后，异步获取 JSON 数据并初始化图表
    window.addEventListener('DOMContentLoaded', () => {
  fetch('nasdaq_vix_data.json')
            .then(response => response.json())
            .then(json => {
                initializeDashboard(json);
            })
            .catch(err => {
                console.error('加载数据失败', err);
                document.getElementById('summary').innerHTML = '<p style="color:red">数据加载失败，请检查 nasdaq_vix_data.json 文件是否存在。</p>';
            });
    });
    </script>
</body>
</html>
